[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lego-sorter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gradio>=5.0.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "requests-oauthlib>=1.3.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
